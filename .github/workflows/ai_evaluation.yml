# .github/workflows/ai_evaluation.yml
name: 🧪 LLM-as-a-Judge Evaluation Pipeline

on:
  pull_request:
    branches: [ main, production ]
  push:
    branches: [ main ]

jobs:
  evaluate-rag-faithfulness:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: ⚙️ Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest openai structlog

      - name: ⚖️ Execute LLM-as-a-Judge Test Suite
        env:
          # Inject secret keys safely from GitHub Repository Secrets
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ENVIRONMENT: "ci_testing"
        run: |
          echo "Running semantic RAG evaluation against proposed prompt changes..."
          python tests/eval_rag_pipeline.py