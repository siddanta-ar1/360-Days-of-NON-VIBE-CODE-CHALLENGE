# .github/workflows/ci-pipeline.yml
name: NOTEacher Frontend CI

# 1. THE TRIGGER
# This pipeline runs every time you push to the 'main' branch or open a Pull Request
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# 2. THE JOBS
jobs:
  build-and-test:
    # We use your preferred operating system for the runner
    runs-on: ubuntu-latest

    steps:
    # Step A: Checkout the code from your repository
    - name: Checkout Codebase
      uses: actions/checkout@v4

    # Step B: Install Node.js
    - name: Setup Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm' # Caches dependencies to make future runs blazing fast

    # Step C: Install your project dependencies
    - name: Install Dependencies
      run: npm ci # 'ci' is strictly better than 'install' for automated environments

    # Step D: Run the Linter (Catches bad code style and unused variables)
    - name: Run ESLint
      run: npm run lint

    # Step E: Verify the Build (Catches fatal Next.js compilation errors)
    - name: Verify Production Build
      run: npm run build
      # We pass dummy environment variables just so the Next.js compiler doesn't crash during the build check
      env:
        NEXT_PUBLIC_SUPABASE_URL: "https://dummy.supabase.co"
        NEXT_PUBLIC_SUPABASE_ANON_KEY: "dummy_key"
  
  deploy-to-production:
    name: Deploy to VPS
    # CRITICAL: This job will ONLY run if the build and tests pass first!
    needs: [build-and-test, test-backend]
    # CRITICAL: Only deploy if the push was to the main branch
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
    - name: Execute Remote SSH Commands
      # We use a community-standard action to handle the SSH handshake
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        script: |
          echo "🚀 Initiating Automated Deployment..."
          
          # Navigate to your project directory
          cd /root/noteacher-vqa
          
          # Pull the latest verified code from GitHub
          git pull origin main
          
          # Rebuild and restart the Docker containers in the background
          # The --build flag ensures any new dependencies are installed
          docker-compose up -d --build
          
          # Clean up old, unused Docker images to prevent the server hard drive from filling up
          docker image prune -f
          
          echo "✅ Deployment Successful. Infrastructure updated."